services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u \"$${MYSQL_USER}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - database

  api:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
    command:
      [
        "sh",
        "-c",
        "npm run prisma:migrate:deploy && npm run prisma:seed && npm start",
      ]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    networks:
      - database
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3333/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - edge

volumes:
  mysql-data:

networks:
  database:
    internal: true
  edge:
