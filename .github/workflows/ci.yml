name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: destiny_bistro_root
          MYSQL_DATABASE: destiny_bistro
          MYSQL_USER: destiny_bistro
          MYSQL_PASSWORD: destiny_bistro
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -udestiny_bistro -pdestiny_bistro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql://destiny_bistro:destiny_bistro@127.0.0.1:3306/destiny_bistro
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: destiny_bistro
      DATABASE_PASSWORD: destiny_bistro
      DATABASE_NAME: destiny_bistro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Validate Docker Compose
        working-directory: .
        run: docker compose --env-file backend/.env.example config
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run prisma:migrate:deploy
      - run: npm run prisma:seed
      - run: npm run prisma:seed
      - run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deployment:
    name: VPS deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: >-
          docker compose
          --env-file deploy/.env.example
          -f compose.vps.yaml
          config --quiet
      - name: Build production images
        run: >-
          docker compose
          --env-file deploy/.env.example
          -f compose.vps.yaml
          build api web

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
