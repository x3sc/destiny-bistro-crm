services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-destiny_bistro_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-destiny_bistro}
      MYSQL_USER: ${MYSQL_USER:-destiny_bistro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-destiny_bistro}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
